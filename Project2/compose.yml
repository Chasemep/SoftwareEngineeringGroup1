services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: coursedb
      MYSQL_USER: courseuser
      MYSQL_PASSWORD: coursepass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend/course-management-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DB: coursedb
      MYSQL_USER: courseuser
      MYSQL_PASSWORD: coursepass
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      SPRING_API_BASE_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql-data:
